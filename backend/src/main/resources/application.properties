server.port=${PORT:5000}

# PostgreSQL Connection (Supabase Session Pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER:postgres.munzcpabkjiuxorgmrse}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Enable multipart file uploads up to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Engine (Groq OpenAI-Compatible API)
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Groq Rate Limit, Concurrency & Token Budget Configuration (8000 TPM Protection)
groq.max-completion-tokens=${GROQ_MAX_COMPLETION_TOKENS:1024}
groq.max-prompt-tokens=${GROQ_MAX_PROMPT_TOKENS:2500}
groq.max-history-turns=${GROQ_MAX_HISTORY_TURNS:2}
groq.max-history-message-length=${GROQ_MAX_HISTORY_MSG_LENGTH:600}
groq.concurrency-limit=${GROQ_CONCURRENCY_LIMIT:2}
groq.queue-capacity=${GROQ_QUEUE_CAPACITY:20}
groq.queue-timeout-ms=${GROQ_QUEUE_TIMEOUT_MS:15000}
groq.max-retries=${GROQ_MAX_RETRIES:3}
groq.base-backoff-ms=${GROQ_BASE_BACKOFF_MS:1000}
groq.max-backoff-ms=${GROQ_MAX_BACKOFF_MS:8000}
groq.user-rpm-limit=${GROQ_USER_RPM_LIMIT:5}

# AI Engine Fallbacks (OpenAI & Google Gemini)
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
gemini.api.key=${GEMINI_API_KEY:}

# Cloud Email Delivery (BREVO ONLY)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:learnpath.platform@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:LearnPath AI}

# JWT Token Signing Secret (Read strictly from environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:}
