server.port=5001

# Completely isolated In-Memory H2 Database with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:learnpath_staging;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=staging_sa
spring.datasource.password=staging_pass_isolated

# Hibernate & JPA Settings for Staging
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Map STAGING_GROQ_API_KEY exclusively to the application's Groq configuration
groq.api.url=${STAGING_GROQ_API_URL:${GROQ_API_URL:https://api.groq.com/openai/v1}}
groq.api.key=${STAGING_GROQ_API_KEY:}
groq.model=${STAGING_GROQ_MODEL:${GROQ_MODEL:openai/gpt-oss-120b}}

# Groq Rate Limit, Concurrency & Token Budget Configuration for Staging (8000 TPM Protection)
groq.max-completion-tokens=${STAGING_GROQ_MAX_COMPLETION_TOKENS:1024}
groq.max-prompt-tokens=${STAGING_GROQ_MAX_PROMPT_TOKENS:2500}
groq.max-history-turns=${STAGING_GROQ_MAX_HISTORY_TURNS:2}
groq.max-history-message-length=${STAGING_GROQ_MAX_HISTORY_MSG_LENGTH:600}
groq.concurrency-limit=${STAGING_GROQ_CONCURRENCY_LIMIT:2}
groq.queue-capacity=${STAGING_GROQ_QUEUE_CAPACITY:20}
groq.queue-timeout-ms=${STAGING_GROQ_QUEUE_TIMEOUT_MS:15000}
groq.max-retries=${STAGING_GROQ_MAX_RETRIES:3}
groq.base-backoff-ms=${STAGING_GROQ_BASE_BACKOFF_MS:1000}
groq.max-backoff-ms=${STAGING_GROQ_MAX_BACKOFF_MS:8000}
groq.user-rpm-limit=${STAGING_GROQ_USER_RPM_LIMIT:5}

# Disable OpenAI and Gemini in staging to prevent silent fallbacks during Groq verification
openai.api.key=
openai.model=
gemini.api.key=

# Isolated JWT Secret for Staging
jwt.secret=LearnPathAIStagingEnvironmentSecretKey2026SecureTokensOnly

# Cloud Email Mock for Staging
brevo.api.key=
brevo.sender.email=staging@learnpath.local
brevo.sender.name=LearnPath Staging
