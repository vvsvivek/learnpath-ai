services:
  - type: web
    name: ai-learning-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/main/dashboard?email=healthcheck
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
