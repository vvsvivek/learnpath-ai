server.port=${PORT:5000}

# PostgreSQL Connection (Supabase Session Pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER:postgres.munzcpabkjiuxorgmrse}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable multipart file uploads up to 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI & Cloud Delivery Integrations
gemini.api.key=${GEMINI_API_KEY:}
resend.api.key=${RESEND_API_KEY:}
brevo.api.key=${BREVO_API_KEY:}

# Spring Mail SMTP
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Token Signing Secret (Read strictly from environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:}
