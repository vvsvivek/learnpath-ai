services:
  - type: web
    name: ai-learning-path-backend
    env: python
    runtime: python-3.12
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: AI Learning Path Generator
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: FACULTY_ALLOWED_DOMAINS
        value: '["@siddhartha.ac.in"]'
      - key: FACULTY_SPECIAL_EMAILS
        value: '["vivekvaranasi99@gmail.com"]'
      - key: STUDENT_INSTITUTIONAL_DOMAIN
        value: "@vrsec.ac.in"
      - key: CORS_ORIGINS
        value: '["*"]'
